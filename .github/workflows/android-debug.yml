name: Android Debug APK

on:
  push:
    branches:
      - 'release/0.17-alpha'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Normalize APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk RB-CineCam-0.17-Alpha-debug.apk

      - name: Verify APK archive
        run: unzip -t RB-CineCam-0.17-Alpha-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RB-CineCam-0.17-Alpha-debug
          path: RB-CineCam-0.17-Alpha-debug.apk
          if-no-files-found: error
