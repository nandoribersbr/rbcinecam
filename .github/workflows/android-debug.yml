name: RB CineCam Android Debug

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable alpha debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rbcinecam-alpha-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply RB CineCam 0.11 structural UI patch
        run: python3 scripts/patch_ui_0_11.py
      - name: Apply RB CineCam 0.12 capture controls
        run: python3 scripts/patch_capture_0_12.py
      - name: Apply RB CineCam 0.13 clean preview and safe reconfiguration
        run: python3 scripts/patch_capture_0_13.py
      - name: Verify 0.13 clean preview and safe reconfiguration
        run: |
          grep -q 'cycleQualitySafe' app/src/main/java/br/com/rb8digital/rbcinecam/camera/RBCameraController.kt
          grep -q 'CaptureBar13' app/src/main/java/br/com/rb8digital/rbcinecam/ui/CameraScreen09.kt
          grep -q 'CameraReconfigurePolicy' app/src/main/java/br/com/rb8digital/rbcinecam/camera/RBCameraController.kt
          grep -q 'versionName = "0.13.0-alpha"' app/build.gradle.kts
          ! grep -q 'Modifier.align(Alignment.TopEnd).*qualityLabel' app/src/main/java/br/com/rb8digital/rbcinecam/ui/CameraScreen09.kt
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RB-CineCam-0.13-Alpha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
