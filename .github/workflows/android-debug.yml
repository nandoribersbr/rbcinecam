name: Android Debug APK

on:
  push:
    branches:
      - 'release/0.17-alpha'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack RB CineCam 0.17 source
        run: unzip -q releases/RB-CineCam-0.17-Alpha-Source.zip -d build-src

      - name: Run unit tests
        working-directory: build-src/rbcinecam017
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: build-src/rbcinecam017
        run: gradle assembleDebug --stacktrace

      - name: Normalize APK name
        run: cp build-src/rbcinecam017/app/build/outputs/apk/debug/app-debug.apk RB-CineCam-0.17-Alpha-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RB-CineCam-0.17-Alpha-debug
          path: RB-CineCam-0.17-Alpha-debug.apk
          if-no-files-found: error
