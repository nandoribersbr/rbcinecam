name: RB CineCam Android Debug

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable alpha debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rbcinecam-alpha-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply RB CineCam 0.11 structural UI patch
        run: python3 scripts/patch_ui_0_11.py
      - name: Apply RB CineCam 0.12 capture controls
        run: python3 scripts/patch_capture_0_12.py
      - name: Apply RB CineCam 0.13 clean preview and safe reconfiguration
        run: python3 scripts/patch_capture_0_13.py
      - name: Apply RB CineCam 0.14 full-bleed translucent UI
        run: python3 scripts/patch_ui_0_14.py
      - name: Apply RB CineCam 0.15 Large Format
        run: python3 scripts/patch_capture_0_15.py
      - name: Apply RB CineCam 0.16 transactional capture and compact UI
        run: python3 scripts/patch_capture_ui_0_16.py
      - name: Verify 0.16 contract
        run: |
          grep -q 'versionName = "0.16.0-alpha"' app/build.gradle.kts
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'CaptureTransactionPolicy' app/src/main/java/br/com/rb8digital/rbcinecam/camera/CaptureTransactionPolicy.kt
          grep -q 'activeQuality = requestedQuality' app/src/main/java/br/com/rb8digital/rbcinecam/camera/RBCameraController.kt
          grep -q 'LF 1.90' app/src/main/java/br/com/rb8digital/rbcinecam/camera/CaptureSettingsPolicy.kt
          grep -q 'LF 1.43' app/src/main/java/br/com/rb8digital/rbcinecam/camera/CaptureSettingsPolicy.kt
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RB-CineCam-0.16-Alpha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
